<div id="last-heard-container" class="card">
  <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <div class="card-title">📜 Real-Time Last Heard Radio Activity</div>
      <span class="badge badge-secondary" style="font-size: 0.75rem;">Live Feed (2.5s)</span>
    </div>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button type="button" class="btn btn-secondary btn-sm" hx-post="/api/telemetry/simulate-call" hx-target="#last-heard-container" hx-swap="outerHTML" hx-disabled-elt="this" title="Inject a clearly-flagged SIM call to test the live feed">
        ⚡ Simulate Call
      </button>
      <button type="button" class="btn btn-secondary btn-sm" hx-post="/api/telemetry/clear-simulated" hx-target="#last-heard-container" hx-swap="outerHTML" hx-disabled-elt="this" title="Remove all SIM rows from the feed">
        🧹 Clear SIM
      </button>
    </div>
  </div>

  <div class="table-container">
    <table class="table-clean">
      <thead>
        <tr>
          <th>Time</th>
          <th>Protocol</th>
          <th>Direction</th>
          <th>Caller (Alias / RID)</th>
          <th>Target Talkgroup</th>
          <th>Slot</th>
          <th>Duration</th>
          <th>BER / RSSI</th>
        </tr>
      </thead>
      <tbody id="last-heard-body" hx-get="/components/last-heard-rows" hx-trigger="every 2.5s [document.visibilityState==='visible']" hx-swap="innerHTML">
        {% include "components/last_heard_rows.html" %}
      </tbody>
    </table>
  </div>
</div>
